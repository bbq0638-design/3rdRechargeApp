<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Kakao Map</title>

  <!-- Kakao Map SDK -->
  <script 
    type="text/javascript" 
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=9f0afa8c53c84fd47bfff12d39ef432f">
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    #map {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
  <div id="map"></div>

  <script>

    let currentMarker = null;
    let currentCircle = null;

    // 초기 지도 (서울역)
    const seoulStation = new kakao.maps.LatLng(37.554722, 126.970833);

    const map = new kakao.maps.Map(document.getElementById("map"), {
      center: seoulStation,
      level: 5,
    });


    // -------------------------------------------------------
    // 🎯 현재위치 마커 아이콘 (하얀 테두리 + 빨간 점)
    // -------------------------------------------------------
    function createCurrentLocationMarker() {
      const size = 26; // 전체 아이콘 크기
      const canvas = document.createElement("canvas");
      canvas.width = size;
      canvas.height = size;

      const ctx = canvas.getContext("2d");

      // 바깥 흰색 테두리 원
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size / 2, -5, Math.PI * 2);
      ctx.fillStyle = "#ffffff";
      ctx.fill();

      // 안쪽 빨간 원
      ctx.beginPath();
      ctx.arc(size / 2, size / 2, size / 2 - 7, 0, Math.PI * 2);
      ctx.fillStyle = "#FF4E4E"; 
      ctx.fill();

      return new kakao.maps.MarkerImage(
        canvas.toDataURL(),
        new kakao.maps.Size(size, size),
        { offset: new kakao.maps.Point(size / 2, size / 2) }
      );
    }


    // -------------------------------------------------------
    // ⭐ Android → HTML 메시지 처리
    // -------------------------------------------------------
    document.addEventListener("message", function (e) {
      let msg = e.data;

      try {
        msg = JSON.parse(msg);
      } catch (err) {
        console.log("JSON parse error:", msg);
      }

      // 📌 init / moveTo → 좌표 이동 + 마커 + 원
      if (msg.type === "init" || msg.type === "moveTo") {
        const newPos = new kakao.maps.LatLng(msg.lat, msg.lng);

        map.panTo(newPos);

        // 기존 마커/원 삭제
        if (currentMarker) currentMarker.setMap(null);
        if (currentCircle) currentCircle.setMap(null);

        // 🔥 새로운 현재위치 마커
        currentMarker = new kakao.maps.Marker({
          position: newPos,
          image: createCurrentLocationMarker(),
          map: map,
        });

        // 🔵 반경 500m 원
        currentCircle = new kakao.maps.Circle({
          center: newPos,
          radius: 500,
          strokeWeight: 1,
          strokeColor: '#4A90E2',
          strokeOpacity: 0.5,
          fillColor: '#4A90E2',
          fillOpacity: 0.15
        });

        currentCircle.setMap(map);
      }

      if (msg === "zoomIn") map.setLevel(map.getLevel() - 1);
      if (msg === "zoomOut") map.setLevel(map.getLevel() + 1);
    });


    // -------------------------------------------------------
    // ⭐ iOS 메시지 처리
    // -------------------------------------------------------
    window.addEventListener("message", function (e) {
      const msg = e.data;

      if (msg === "zoomIn") map.setLevel(map.getLevel() - 1);
      if (msg === "zoomOut") map.setLevel(map.getLevel() + 1);
    });

  </script>
</body>
</html>
